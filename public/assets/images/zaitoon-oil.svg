<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F7F5EE" />
      <stop offset="100%" stop-color="#E8E2D5" />
    </radialGradient>
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E2319" />
      <stop offset="25%" stop-color="#1B3E2D" />
      <stop offset="50%" stop-color="#2D5C43" />
      <stop offset="75%" stop-color="#1B3E2D" />
      <stop offset="100%" stop-color="#0A1811" />
    </linearGradient>
    <linearGradient id="oilSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B8F3E" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#C5A059" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4C5C26" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6B27" />
      <stop offset="35%" stop-color="#E5C77A" />
      <stop offset="70%" stop-color="#B89242" />
      <stop offset="100%" stop-color="#6B511C" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5" />
      <stop offset="100%" stop-color="#F2ECE0" />
    </linearGradient>
    <filter id="bottleShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#0F291E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Soft Pedestal Shadow -->
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#0F291E" opacity="0.18" />
  <ellipse cx="300" cy="510" rx="90" ry="14" fill="#0F291E" opacity="0.22" />

  <!-- Bottle Group -->
  <g filter="url(#bottleShadow)">
    <!-- Bottle Neck -->
    <path d="M 276 130 L 324 130 L 324 210 L 345 255 L 345 475 C 345 488 335 496 320 496 L 280 496 C 265 496 255 488 255 475 L 255 255 L 276 210 Z" fill="url(#bottleGlass)" />

    <!-- Glass Specular Highlight (Left edge) -->
    <path d="M 262 260 L 268 260 L 268 475 L 262 475 Z" fill="#FFFFFF" opacity="0.22" />
    
    <!-- Bottle Inner Glow/Oil Glimmer -->
    <path d="M 285 270 Q 300 270 315 270 L 330 470 C 325 480 275 480 270 470 Z" fill="url(#oilSheen)" />

    <!-- Label -->
    <rect x="268" y="275" width="64" height="150" rx="4" fill="url(#labelGrad)" stroke="#B89242" stroke-width="1.5" />
    
    <!-- Label Detail -->
    <line x1="274" y1="285" x2="326" y2="285" stroke="#B89242" stroke-width="0.75" />
    <text x="300" y="302" font-family="'Times New Roman', serif" font-size="7" font-weight="bold" fill="#0F291E" text-anchor="middle" letter-spacing="1">WAZIRISTANI</text>
    <text x="300" y="316" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#B89242" text-anchor="middle">ZAITOON</text>
    <text x="300" y="327" font-family="'Times New Roman', serif" font-size="6.5" font-weight="600" fill="#3D482E" text-anchor="middle" letter-spacing="0.5">NATURAL OIL</text>
    <line x1="282" y1="334" x2="318" y2="334" stroke="#B89242" stroke-width="0.5" />
    
    <!-- Olive Branch Icon on Label -->
    <circle cx="300" cy="350" r="3.5" fill="#5F7047" />
    <ellipse cx="295" cy="346" rx="3.5" ry="1.8" fill="#758A59" transform="rotate(-30 295 346)" />
    <ellipse cx="305" cy="346" rx="3.5" ry="1.8" fill="#758A59" transform="rotate(30 305 346)" />

    <text x="300" y="375" font-family="sans-serif" font-size="5.5" font-weight="500" fill="#525B54" text-anchor="middle">PURE HERITAGE</text>
    <text x="300" y="388" font-family="sans-serif" font-size="5" fill="#8A938C" text-anchor="middle">PRODUCT OF PAKISTAN</text>
    <line x1="274" y1="412" x2="326" y2="412" stroke="#B89242" stroke-width="0.75" />

    <!-- Cap -->
    <rect x="272" y="100" width="56" height="34" rx="2" fill="url(#goldCap)" stroke="#8B6B27" stroke-width="0.8" />
    <line x1="272" y1="112" x2="328" y2="112" stroke="#6B511C" stroke-width="0.5" />
    <line x1="272" y1="124" x2="328" y2="124" stroke="#6B511C" stroke-width="0.5" />
  </g>

  <!-- Decorative Olive Branch accents in corner -->
  <g opacity="0.35" transform="translate(70, 440) scale(0.9)">
    <path d="M 10 50 Q 50 10 90 20" stroke="#4E5C3B" stroke-width="3" fill="none" stroke-linecap="round" />
    <ellipse cx="40" cy="32" rx="14" ry="7" fill="#5F7047" transform="rotate(-35 40 32)" />
    <ellipse cx="65" cy="18" rx="14" ry="7" fill="#758A59" transform="rotate(-20 65 18)" />
    <ellipse cx="85" cy="22" rx="12" ry="6" fill="#4E5C3B" transform="rotate(10 85 22)" />
    <circle cx="50" cy="45" r="9" fill="#20523C" />
    <circle cx="75" cy="35" r="8" fill="#173D2D" />
  </g>
</svg>
