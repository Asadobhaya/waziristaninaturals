<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#E8CE8C" />
      <stop offset="100%" stop-color="#B89242" />
    </linearGradient>
  </defs>
  <!-- Mountain & Olive Icon -->
  <g transform="translate(15, 20) scale(0.6)">
    <!-- Mountain Peaks -->
    <polygon points="50,15 90,85 10,85" fill="#0F291E" />
    <polygon points="50,15 65,85 10,85" fill="#173D2D" />
    <polygon points="75,35 105,85 45,85" fill="#20523C" opacity="0.8" />
    <!-- Olive Leaves & Sun -->
    <circle cx="50" cy="12" r="6" fill="url(#goldText)" />
    <path d="M 30,55 Q 50,40 70,55" stroke="url(#goldText)" stroke-width="3" fill="none" />
  </g>
  <!-- Brand Name English -->
  <text x="95" y="52" font-family="'Times New Roman', Georgia, serif" font-size="28" font-weight="900" fill="#0F291E" letter-spacing="4">WAZIRISTANI</text>
  <!-- Subtitle -->
  <text x="97" y="72" font-family="sans-serif" font-size="9" font-weight="600" fill="#758A59" letter-spacing="2.5">PURE MOUNTAIN HERITAGE • PAKISTAN</text>
</svg>
