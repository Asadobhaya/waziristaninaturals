<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="shilajitBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="60%" stop-color="#EBE4D5" />
      <stop offset="100%" stop-color="#D6CDBB" />
    </radialGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1815" />
      <stop offset="25%" stop-color="#2D2821" />
      <stop offset="50%" stop-color="#42392D" />
      <stop offset="75%" stop-color="#2A241C" />
      <stop offset="100%" stop-color="#14120F" />
    </linearGradient>
    <linearGradient id="goldLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73571A" />
      <stop offset="25%" stop-color="#B89242" />
      <stop offset="50%" stop-color="#F2DA91" />
      <stop offset="75%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#594212" />
    </linearGradient>
    <linearGradient id="shilajitLabel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171C19" />
      <stop offset="100%" stop-color="#0B0E0C" />
    </linearGradient>
    <filter id="jarShadow" x="-25%" y="-15%" width="150%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0F1511" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#shilajitBg)" />

  <!-- Mountain Silhouette in Background -->
  <path d="M 0 350 L 120 270 L 220 330 L 360 210 L 480 320 L 600 240 L 600 600 L 0 600 Z" fill="#D8CFBF" opacity="0.35" />

  <!-- Pedestal shadow -->
  <ellipse cx="300" cy="510" rx="160" ry="26" fill="#141815" opacity="0.25" />
  <ellipse cx="300" cy="510" rx="110" ry="16" fill="#141815" opacity="0.3" />

  <!-- The Shilajit Jar -->
  <g filter="url(#jarShadow)">
    <!-- Jar Body (Stout heavy cosmetic glass jar) -->
    <rect x="200" y="270" width="200" height="210" rx="20" fill="url(#jarGlass)" stroke="#231F19" stroke-width="2" />

    <!-- Specular highlight left -->
    <rect x="210" y="280" width="12" height="190" rx="6" fill="#FFFFFF" opacity="0.15" />

    <!-- Pure Resin Visible Base -->
    <path d="M 220 420 Q 300 425 380 420 L 380 460 C 380 470 370 475 355 475 L 245 475 C 230 475 220 470 220 460 Z" fill="#0A0907" />

    <!-- Label -->
    <rect x="215" y="300" width="170" height="130" rx="8" fill="url(#shilajitLabel)" stroke="#B89242" stroke-width="1.8" />
    
    <!-- Label Ornamentation -->
    <rect x="220" y="305" width="160" height="120" rx="6" fill="none" stroke="#B89242" stroke-width="0.7" opacity="0.6" />
    <text x="300" y="328" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#FBF9F5" text-anchor="middle" letter-spacing="2">WAZIRISTANI</text>
    <text x="300" y="352" font-family="'Times New Roman', serif" font-size="19" font-weight="bold" fill="#D4AF37" text-anchor="middle">SHILAJIT</text>
    <text x="300" y="369" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#E8DEC9" text-anchor="middle" letter-spacing="1">AUTHENTIC MOUNTAIN RESIN</text>
    <line x1="250" y1="378" x2="350" y2="378" stroke="#B89242" stroke-width="0.75" />
    <text x="300" y="394" font-family="'Noto Nastaliq Urdu', sans-serif" font-size="10" fill="#D4AF37" text-anchor="middle">خالص پہاڑی سلاجیت</text>
    <text x="300" y="410" font-family="sans-serif" font-size="8" fill="#8A938C" text-anchor="middle">HERITAGE GRADE • SEALED JAR</text>

    <!-- Golden Lid -->
    <rect x="190" y="225" width="220" height="50" rx="6" fill="url(#goldLid)" stroke="#8B6B27" stroke-width="1.5" />
    <!-- Lid Ridges -->
    <line x1="192" y1="238" x2="408" y2="238" stroke="#684F17" stroke-width="1" />
    <line x1="192" y1="255" x2="408" y2="255" stroke="#F5E7C4" stroke-width="1" opacity="0.6" />
    <line x1="192" y1="262" x2="408" y2="262" stroke="#684F17" stroke-width="1" />
  </g>

  <!-- Mountain Rock Crystals accent around base -->
  <path d="M 140 500 L 180 460 L 210 495 L 190 520 Z" fill="#3D3A36" opacity="0.5" />
  <path d="M 400 505 L 430 470 L 460 500 L 440 525 Z" fill="#2E2C29" opacity="0.6" />
</svg>
